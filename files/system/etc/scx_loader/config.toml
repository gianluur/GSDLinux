# /etc/scx_loader/config.toml
# Default scheduler to start on boot
default_sched = "scx_bpfland"

# Default mode to use when starting the scheduler
default_mode = "Gaming"

# Custom flags for scx_bpfland in each mode
[scheds.scx_bpfland]
# "Auto" mode: lets the scheduler choose its own settings
auto_mode = ["-m", "auto"]

# "Gaming" mode: optimized for performance and responsiveness
gaming_mode = ["-m", "performance"]

# "LowLatency" mode: further tunes for minimal latency
lowlatency_mode = ["-k", "-s", "5000", "-l", "5000"]

# "PowerSave" mode: optimizes for energy efficiency
powersave_mode = ["-m", "powersave"]

[preferred]
default=kde;gnome;gtk;

# Use KDE for the desktop-integrated interfaces
org.freedesktop.impl.portal.Access=kde;gtk;
org.freedesktop.impl.portal.Notification=kde;gtk;
org.freedesktop.impl.portal.FileChooser=kde;gtk;
org.freedesktop.impl.portal.Settings=kde;gtk;

# Keep your oo7 secret setup as previously configured
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;

# Screen recording & screenshots via the GNOME portal (niri compatible)
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Screenshot=gnome;

---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      copr:
        - duxlabs/dux-repo
        - duxlabs/dms
        - lionheartp/Hyprland
        - deltacopy/darkly

    install:
      packages:
        - niri
        - greetd
        - dux-qt-base
        - gtk4-layer-shell
        - matugen
        - quickshell
        - xwayland-satellite
        - dux-search
        - dux-greeter
        - dux-calendar
        - dms
        - nwg-look
        - qt6ct-kde
        - darkly
        - xdg-desktop-portal
        - xdg-desktop-portal-kde
        - xdg-desktop-portal-gnome
        - cups-pk-helper
        - power-profiles-daemon
        - qt6-qtimageformats
        - khal
        - oo7-daemon
        - pam_oo7
        - oo7-portal
        - oo7-cli
        - adw-gtk3-theme

  - type: default-flatpaks
    system:
      install:
        - org.gtk.Gtk3theme.adw-gtk3
        - org.gtk.Gtk3theme.adw-gtk3-dark

  - type: script
    scripts:
      - install_icons.sh

  - type: systemd
    system:
      enabled:
        - darkly-setup.service

---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
    - type: dnf

      install:
          packages:
              - qemu-kvm
              - libvirt
              - virt-install
              - edk2-ovmf
              - swtpm
              - qemu-img
              - freerdp
              - uxplay
              - podman
              - toolbox
              - distrobox

    - type: script
      snippets:
          - "mkdir -p /var/lib/swtpm-localca"
          - "chown tss:tss /var/lib/swtpm-localca"
          - "restorecon -Rv /var/lib/libvirt /var/log/libvirt /var/lib/swtpm-localca 2>/dev/null || true"

    - type: systemd
      system:
          enabled:
              - nix-daemon.socket
              - virtqemud.socket
              - virtlxcd.socket
              - virtxend.socket
              - virtvboxd.socket
              - virtnetworkd.socket
              - virtstoraged.socket

          disabled:
              - NetworkManager-wait-online.service
              - fedora-atomic-desktop-mandb-update.service
              - systemd-oomd.service
              - libvirtd.service

---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      files:
        add:
          - https://download.docker.com/linux/fedora/docker-ce.repo

    install:
      packages:
        - qemu-kvm
        - libvirt
        - virt-install
        - edk2-ovmf
        - swtpm
        - qemu-img
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - freerdp
        - uxplay

  - type: script
    snippets:
      - "mkdir -p /var/lib/swtpm-localca"
      - "chown tss:tss /var/lib/swtpm-localca"
      - "restorecon -Rv /var/lib/libvirt /var/log/libvirt /var/lib/swtpm-localca 2>/dev/null || true"

  - type: systemd
    system:
      enabled:
        - docker.socket
        - nix-daemon.socket
        - virtqemud.socket
        - virtlxcd.socket
        - virtxend.socket
        - virtvboxd.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        
      disabled:
        - NetworkManager-wait-online.service
        - fedora-atomic-desktop-mandb-update.service
        - systemd-oomd.service
        - docker.service
        - libvirtd.service

---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: script
    snippets:
      - "dnf remove -y --setopt=tsflags=noscripts plasma-* kwin-* kde-* kio-* kaccounts-* kscreen* ksystemstats ksshaskpass kwayland plasma5support polkit-kde* layer-shell-qt kactivitymanagerd kdecoration kpipewire kwrite* kwalletmanager5 kdegraphics-mobipocket steamdeck-kde-presets* sddm*"

  - type: dnf
    remove:
      packages:
        - firefox
        - alacritty
        - kf6-*
        - kf5-*
        - tuned
        - tuned-ppd
        - bazaar
        - fish
        - msedit
        - cockpit-*
        - btop
        - fastfetch
        - tailscale
        - fira-code-fonts
        - lato-fonts
        - gnome-disks

  - type: script
    snippets:
      - "rm -rf /usr/share/icons/KDE_Classic"
      - "rm -rf /usr/share/icons/Oxygen_*"
      - "rm -rf oxygen"

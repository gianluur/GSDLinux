---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
    - type: dnf
      repos:
          copr:
              enable:
                  - atim/starship
                  - lihaohong/yazi
                  - jdxcode/mise

      install:
          packages:
              - fastfetch
              - yazi
              - eza
              - zoxide
              - bat
              - ripgrep
              - fd-find
              - fzf
              - tldr
              - btop
              - gh
              - jq
              - yq
              - unzip
              - wget
              - curl
              - git
              - starship
              - zsh
              - distrobox
              - mise
              - nix
              - wl-clipboard

    - type: systemd
      system:
          enabled:
              - nix-daemon.socket
              - nix-daemon
              - nix.mount
              - nix-directory
